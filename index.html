<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="projeto-contador/js.js">

    <title>Contador</title>
</head>
<body>
    <header class="header">
        <center>
            <img src="midias/facelogo.png" alt="" class="logo">
        </center>

        <div class="links">
          <center>
            <a href="#">sobre</a>
            <a href="#">contatos</a>
            <a href="#">tickets</a>
          </center>
        </div>   
    </header>
    
    <center>
    <div class="countdown"><!--contagem regressiva-->
        <h2 class="text-c">FALTAM</h2>
        <div class="horas">
            <h1 id="dias" class="numero">00</h1>
            <h2 class="text-c">DIAS</h2>

            <h1 id="horas" class="numero">00</h1>
            <h2 class="text-c">HORAS</h2>

            <h1  id="minutos" class="numero">00</h1>
            <h2 class="text-c">MINUTOS</h2>

            <h1 id="segundos" class="numero">00</h1>
            <h2 class="text-c">SEGUNDOS</h2>
                    
        </div>
        <h2 class="text-c">PARA   'FLY with Me: World Tour'</h2>

    </div><!--Final contagem regressiva-->
    </center>
    <br><br>
    <!--Banner-->
    <center>
    <div class="banner">
        <img src="midias/albumface.jpg" alt="membros face" class="img1"> 
        <img src="midias/facebanner.jpg" alt="membros face" class="img2"> 
        <img src="midias/keito4.jpeg" alt="membros face" class="img3"> 
        <img src="midias/fly.jpg" alt="membros face" class="img4"> 
        <img src="midias/banner2.jpg" alt="membros face" class="img5"> 
    </div> 
    </center>
  
    <!--fechamento banner-->
    
    <center><h1>DISCOGRAFIA</h1></center>
    <br><br>

    <script src="js.js"></script>
</body>
</html>
